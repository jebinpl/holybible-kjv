<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bible - King James Version</title>
<link rel="icon" type="image/png" href="logo.png">
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;

    background:
        radial-gradient(
            circle at top,
            #fffdf5 0%,
            #f5ecd5 50%,
            #e7d3a9 100%
        );

    color: #3b2817;
}


/* =========================
   HEADER
========================= */

.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 105px;
    z-index: 1000;

    background:
        linear-gradient(
            135deg,
            #3b210d,
            #70451e,
            #3b210d
        );

    color: white;

    padding: 10px 20px;

    border-bottom: 4px solid #d4af37;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.25);

    display: flex;
    align-items: center;
}

/* LOGO — TOP LEFT */
.header-logo {
    width: clamp(48px, 9vw, 90px);
    height: clamp(48px, 9vw, 90px);

    object-fit: contain;
}


/* TITLE */
.header-title {
    flex: 1;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    min-width: 0;
}

.header h1 {
    font-size: clamp(20px, 5vw, 48px);
    letter-spacing: clamp(0.5px, 0.4vw, 2px);

    white-space: nowrap;
    text-align: center;
    margin: 0;
}


/* SUBTITLE */
.header-subtitle {
    color: #f4d982;

    font-size: clamp(9px, 2.2vw, 16px);

    letter-spacing: clamp(0.5px, 0.6vw, 3px);

    white-space: nowrap;
    text-align: center;
    margin-top: 6px;
}

/* =========================
   TOP RIGHT HEADER CONTROLS
========================= */

.header-controls {
    margin-left: auto;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 5px;
}


/* AUDIO VERSION */

.audio-version {
    color: #f4d982;

    font-size: clamp(7px, 1.8vw, 14px);

    font-weight: bold;

    letter-spacing: clamp(0px, 0.2vw, 1px);

    white-space: nowrap;
}


/* HOME BUTTON */

.home-header-button {
    border: 1px solid #d4af37;

    border-radius: 20px;

    padding: clamp(3px, 1vw, 6px)
             clamp(7px, 1.5vw, 16px);

    background:
        linear-gradient(
            135deg,
            #f4d982,
            #c99b2e
        );

    color: #3b210d;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(9px, 1.8vw, 14px);

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 3px 8px rgba(0,0,0,0.25);

    transition: 0.2s;
}


.home-header-button:hover {

    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            #ffe99a,
            #d4af37
        );

    box-shadow:
        0 5px 12px rgba(0,0,0,0.35);
}


.home-header-button:active {

    transform: scale(0.95);

}
/* =========================
   MAIN
========================= */

.main {
    padding: 125px 20px 40px;
    max-width: 1100px;
    margin: auto;
}


/* =========================
   PAGE
========================= */

.page {
    display: none;
}

.page-title {
    text-align: center;
    font-size: 34px;
    margin: 0;
    padding: 12px 10px 5px;

    background:
        linear-gradient(
            180deg,
            #fffdf5,
            #f5ecd5
        );

    border-bottom: none;
}


.page-subtitle {
    text-align: center;
    margin: 0 0 25px;
    padding: 0 10px 12px;

    color: #76582e;

    background: #f5ecd5;

    border-bottom: 2px solid #c7a85b;
}

/* =========================
   VIDEO PAGE
========================= */

#videoPage .page-title {
    font-size: 24px;
    padding: 6px 10px 2px;
    margin: 0;
}

#videoPage .page-subtitle {
    font-size: 14px;
    padding: 0 10px 6px;
    margin: 0 0 12px;
}

/* =========================
   TESTAMENT BUTTONS
========================= */

.testaments {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;

    max-width: 900px;

    margin: 60px auto;
}

.testament-button {
    min-height: 250px;

    border: none;
    border-radius: 22px;

    cursor: pointer;

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.20);

    transition: 0.25s;
}

.testament-button:hover {
    transform: translateY(-8px);

    box-shadow:
        0 18px 35px rgba(0,0,0,0.30);
}

.testament-button:active {
    transform: scale(0.97);
}

.old-testament {
    background:
        linear-gradient(
            135deg,
            #674016,
            #a66d2c,
            #75491d
        );
}

.new-testament {
    background:
        linear-gradient(
            135deg,
            #1d4851,
            #327582,
            #235964
        );
}

.book-icon {
    font-size: 58px;
    margin-bottom: 15px;
}

.testament-button h2 {
    font-size: 30px;
    transform: translateY(-2px);
}

.book-count {
    margin-top: 10px;
    font-size: 16px;
}


/* =========================
   BOOK GRID
========================= */

.book-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.book-button {
    background: rgba(255,255,255,0.78);

    border: 2px solid #c7a85b;

    border-radius: 12px;

    padding: 18px 12px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 18px;

    color: #4a321c;

    cursor: pointer;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.08);

    transition: 0.2s;
}

.book-button:hover {
    background: #fff8df;

    transform: translateY(-3px);

    box-shadow:
        0 8px 15px rgba(0,0,0,0.15);
}

.book-number {
    display: block;

    font-size: 13px;

    color: #98752d;

    margin-bottom: 5px;
}

.book-chapters {
    display: block;

    margin-top: 6px;

    font-size: 12px;

    color: #98752d;
}


/* =========================
   CHAPTER GRID
========================= */

.chapter-grid {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 12px;

    max-width: 900px;

    margin: auto;
}

.chapter-button {
    height: 58px;

    border: 2px solid #c7a85b;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #fffdf5,
            #f5e8c5
        );

    color: #4b3018;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 4px 9px rgba(0,0,0,0.08);

    transition: 0.2s;
}

.chapter-button:hover {
    background: #d4af37;

    color: white;

    transform: translateY(-3px);
}


/* =========================
   VIDEO BUTTON
========================= */

.video-list {
    width: 100%;
    max-width: 700px;

    margin: 25px auto;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.video-button {
    width: 100%;

    display: flex;
    align-items: center;

    text-align: left;

    padding: 20px;

    border: 2px solid #c7a85b;
    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #fffdf5,
            #f3e3bd
        );

    color: #4b3018;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(0,0,0,0.12);

    transition: 0.2s;
}

.video-button:hover {
    transform: translateY(-3px);

    background: #fff7dc;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.16);
}

.video-icon {
    flex-shrink: 0;

    margin-right: 15px;

    font-size: 28px;
}

.video-content {
    text-align: left;
}


/* =========================
   YOUTUBE PLAYER
========================= */

/* =========================
   PERSISTENT VIDEO PLAYER
========================= */

.video-player-container {

    display: none;

    position: sticky;

    top: 105px;

    z-index: 950;

    width: 100%;

    max-width: 650px;

    margin: 10px auto 20px;

    background: #181818;

    padding: 10px;

    border-radius: 14px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30);
}


.video-player {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;
}


.video-player iframe {

    width: 100%;

    height: 100%;

    border: none;

    border-radius: 8px;
}


.close-video {

    display: block;

    margin: 12px auto 3px;

    padding: 8px 20px;

    border: none;

    border-radius: 20px;

    background: #555;

    color: white;

    cursor: pointer;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 15px;
}


.close-video:hover {

    background: #777;

}

.video-player {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;
}

.video-player iframe {
    width: 100%;
    height: 100%;

    border: none;

    border-radius: 8px;
}

.close-video {
    display: block;

    margin: 12px auto 3px;

    padding: 8px 20px;

    border: none;

    border-radius: 20px;

    background: #555;

    color: white;

    cursor: pointer;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 15px;
}

.close-video:hover {
    background: #777;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {
    display: block;

    margin: 35px auto 10px;

    border: none;

    border-radius: 30px;

    background: #4b3018;

    color: white;

    padding: 13px 30px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 17px;

    cursor: pointer;
}

.back-button:hover {
    background: #70451e;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {
        height: 95px;
    }

    .main {
        padding-top: 115px;
    }

    .audio-version {
        font-size: 10px;
        letter-spacing: 0.5px;
    }

    .home-header-button {
        padding: 5px 11px;
        font-size: 12px;
    }

    .testaments {
        grid-template-columns: 1fr;
        margin: 30px 30px;
    }

    .testament-button {
        min-height: 200px;
    }

    .book-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .chapter-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .book-button {
        font-size: 16px;
    }

#videoPage .page-title {
    font-size: 20px;
}
}

@media (max-width: 450px) {

    .header {
        height: 90px;
    }

    .main {
        padding-top: 110px;
    }


    .audio-version {
        font-size: 9px;
        letter-spacing: 0.3px;
    }

    .home-header-button {
        padding: 4px 9px;
        font-size: 11px;
    }

    .chapter-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .chapter-button {
        height: 52px;
        font-size: 18px;
    }

    .video-button {
        font-size: 17px;
    }

#videoPage .page-title {
    font-size: 18px;
}
}

@media (max-width: 330px) {

    .chapter-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <img
        src="logo.png"
        alt="Holy Bible Logo"
        class="header-logo"
    >

    <!-- CENTER HEADER TEXT -->
    <div class="header-title">

        <h1>HOLY BIBLE</h1>

        <div class="header-subtitle">
            KING JAMES VERSION
        </div>

    </div>

    <!-- RIGHT HEADER CONTROLS -->
    <div class="header-controls">

        <div class="audio-version">
            🔊 Video Version
        </div>

        <button
            class="home-header-button"
            onclick="goHome()">

            🏠 HOME

        </button>

    </div>

</header>

<main class="main">

    <!-- =========================
         COMMON VIDEO PLAYER
    ========================= -->

    <div
        id="videoPlayerContainer"
        class="video-player-container">

        <div class="video-player">

            <iframe
                id="youtubePlayer"
                src="https://www.youtube.com/embed/?enablejsapi=1"
                title="Bible Video"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen>
            </iframe>

        </div>

        <button
            class="close-video"
            onclick="closeBibleVideo()">

            ✕ Close Video

        </button>

    </div>

<!-- =========================
     HOME PAGE
========================= -->

<section
    id="homePage"
    class="page"
    style="display:block;">

    <div class="testaments">

        <button
            class="testament-button old-testament"
            onclick="showBooks('old')">

            <div class="book-icon">
                📜
            </div>

            <h2>
                OLD 
            </h2>

            <h2> 
                TESTAMENT
            </h2>

            <div class="book-count">
                39 BOOKS
            </div>

        </button>


        <button
            class="testament-button new-testament"
            onclick="showBooks('new')">

            <div class="book-icon">
                ✝️
            </div>

            <h2>
                NEW 
            </h2>

            <h2> 
                TESTAMENT
            </h2>

            <div class="book-count">
                27 BOOKS
            </div>

        </button>

    </div>

</section>


<!-- =========================
     BOOK PAGE
========================= -->

<section 
    id="bookPage" 
    class="page"> 

    <div class="sticky-page-header">

        <h2 
            id="bookPageTitle" 
            class="page-title"> 
        </h2> 

        <p 
            id="bookPageSubtitle" 
            class="page-subtitle"> 
        </p> 

    </div>

    <div 
        id="bookGrid" 
        class="book-grid"> 
    </div>

    <button
        class="back-button"
        onclick="goHome()">

        ← BACK

    </button>

</section>


<!-- =========================
     CHAPTER PAGE
========================= -->

<section
    id="chapterPage"
    class="page">

<div class="sticky-page-header">

    <h2 
        id="chapterPageTitle" 
        class="page-title"> 
    </h2> 

    <p 
        id="chapterPageSubtitle" 
        class="page-subtitle"> 
    </p>

</div>

    <div
        id="chapterGrid"
        class="chapter-grid">
    </div>

    <button
        class="back-button"
        onclick="backToBooks()">

        ← BACK TO BOOKS

    </button>

</section>

<!-- =========================
     VIDEO PAGE
========================= -->

<section
    id="videoPage"
    class="page">

    <h2
        id="videoPageTitle"
        class="page-title">
    </h2>

    <p
        class="page-subtitle">
        Bible Videos
    </p>


    <!-- =========================
         VIDEO LIST
    ========================= -->

    <div
        id="videoList"
        class="video-list">
    </div>


    <button
        class="back-button"
        onclick="backToChapters()">

        ← BACK TO CHAPTERS

    </button>

</section>


</main>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   BIBLE BOOKS
========================================================= */

const bible = {

    /* =====================
       OLD TESTAMENT
    ===================== */

    old: [

        ["Genesis", 50],
        ["Exodus", 40],
        ["Leviticus", 27],
        ["Numbers", 36],
        ["Deuteronomy", 34],

        ["Joshua", 24],
        ["Judges", 21],
        ["Ruth", 4],

        ["1 Samuel", 31],
        ["2 Samuel", 24],

        ["1 Kings", 22],
        ["2 Kings", 25],

        ["1 Chronicles", 29],
        ["2 Chronicles", 36],

        ["Ezra", 10],
        ["Nehemiah", 13],
        ["Esther", 10],

        ["Job", 42],
        ["Psalms", 150],
        ["Proverbs", 31],
        ["Ecclesiastes", 12],
        ["Song of Solomon", 8],

        ["Isaiah", 66],
        ["Jeremiah", 52],
        ["Lamentations", 5],
        ["Ezekiel", 48],
        ["Daniel", 12],

        ["Hosea", 14],
        ["Joel", 3],
        ["Amos", 9],
        ["Obadiah", 1],
        ["Jonah", 4],
        ["Micah", 7],
        ["Nahum", 3],
        ["Habakkuk", 3],
        ["Zephaniah", 3],
        ["Haggai", 2],
        ["Zechariah", 14],

        /* FIXED */
        ["Malachi", 4]

    ],


    /* =====================
       NEW TESTAMENT
    ===================== */

    new: [

        ["Matthew", 28],
        ["Mark", 16],
        ["Luke", 24],
        ["John", 21],

        ["Acts", 28],

        ["Romans", 16],

        ["1 Corinthians", 16],
        ["2 Corinthians", 13],

        ["Galatians", 6],
        ["Ephesians", 6],
        ["Philippians", 4],
        ["Colossians", 4],

        ["1 Thessalonians", 5],
        ["2 Thessalonians", 3],

        ["1 Timothy", 6],
        ["2 Timothy", 4],

        ["Titus", 3],
        ["Philemon", 1],

        ["Hebrews", 13],
        ["James", 5],

        ["1 Peter", 5],
        ["2 Peter", 3],

        ["1 John", 5],
        ["2 John", 1],
        ["3 John", 1],

        ["Jude", 1],

        /* FIXED */
        ["Revelation", 22]

    ]

};


/* =========================================================
   SHOW BOOKS
========================================================= */

function showBooks(testament) {

    sessionStorage.setItem("testament", testament);
    sessionStorage.setItem("page", "books");

    document.getElementById("homePage").style.display =
        "none";

    document.getElementById("chapterPage").style.display =
        "none";

    document.getElementById("videoPage").style.display =
        "none";

    document.getElementById("bookPage").style.display =
        "block";


    const title =
        document.getElementById("bookPageTitle");

    const subtitle =
        document.getElementById("bookPageSubtitle");

    const grid =
        document.getElementById("bookGrid");


    const books =
        bible[testament];


    if (testament === "old") {

        title.textContent =
            "Old Testament";

        subtitle.textContent =
            "39 Books";

    } else {

        title.textContent =
            "New Testament";

        subtitle.textContent =
            "27 Books";

    }


    grid.innerHTML = "";


    books.forEach(function(book, index) {

        const button =
            document.createElement("button");


        button.className =
            "book-button";


        button.innerHTML = `

            <span class="book-number">
                BOOK ${index + 1}
            </span>

            ${book[0]}

            <span class="book-chapters">
                ${book[1]}
                ${book[1] === 1 ? "Chapter" : "Chapters"}
            </span>

        `;


        button.onclick = function() {

            showChapters(
                book[0],
                book[1]
            );

        };


        grid.appendChild(button);

    });

}


/* =========================================================
   SHOW CHAPTERS
========================================================= */

function showChapters(bookName, chapterCount) {

    sessionStorage.setItem("book", bookName);
    sessionStorage.setItem("page", "chapters");

    document.getElementById("bookPage").style.display =
        "none";

    document.getElementById("videoPage").style.display =
        "none";

    document.getElementById("chapterPage").style.display =
        "block";


    document.getElementById("chapterPageTitle")
        .textContent =
        bookName;


    document.getElementById("chapterPageSubtitle")
        .textContent =
        chapterCount +
        (chapterCount === 1
            ? " Chapter"
            : " Chapters");


    const grid =
        document.getElementById("chapterGrid");


    grid.innerHTML = "";


    for (
        let chapter = 1;
        chapter <= chapterCount;
        chapter++
    ) {

        const button =
            document.createElement("button");


        button.className =
            "chapter-button";


        button.textContent =
            chapter;


        button.onclick = function() {

            openChapter(
                bookName,
                chapter
            );

        };


        grid.appendChild(button);

    }

}


/* =========================================================
   OPEN CHAPTER
========================================================= */

function openChapter(book, chapter) {
    currentVideoIndex = -1;
    sessionStorage.setItem("book", book);
    sessionStorage.setItem("chapter", chapter);
    sessionStorage.setItem("page", "videos");

    document.getElementById("chapterPage").style.display =
        "none";

    document.getElementById("videoPage").style.display =
        "block";

    document.getElementById("videoPageTitle").textContent =
        book + " - Chapter " + chapter;

    document.querySelector("#videoPage .page-subtitle").textContent =
        "Bible Videos";

    loadChapterVideos(book, chapter);
}


function loadChapterVideos(book, chapter) {

    const videoList =
        document.getElementById("videoList");

    videoList.innerHTML = "";
    /* =========================
       MATTHEW CHAPTER 4
    ========================= */
    if (
        book === "Matthew" &&
        chapter === 4
    ) {

        addVideoButton(
            "Jesus Temptation at the Wilderness",
            "Matthew 4:1-11",
            "f8L3SjsLMLU"
        );


        addVideoButton(
            "Jesus Begins His Ministry",
            "Matthew 4:12-17",
            "hVoqbVE4D6E"
        );


        addVideoButton(
            "Jesus Calls His Disciples",
            "Matthew 4:18-22",
            "bGk3qfUkNBM"
        );

        addVideoButton(
            "Fame of JESUS",
            "Matthew 4:23-25",
            "UYiuYfzTvCw"
        );

    }
 /* =========================
       MATTHEW CHAPTER 5
    ========================= */

    if (
        book === "Matthew" &&
        chapter === 5
    ) {

        addVideoButton(
            "Mountain Teaching - 1",
            "Matthew 5:1-12",
            "cA9WtUr_PbA"
        );

         addVideoButton(
            "Mountain Teaching - 2",
            "Matthew 5:13-16",
            "uxu2XA0fnoQ"
        );

        addVideoButton(
            "Mountain Teaching - 3",
            "Matthew 5:17-20",
            "sfYFoP9ZcBo"
        );

        addVideoButton(
            "Mountain Teaching - 4",
            "Matthew 5:21-26",
            "bR1kAiTVOQI"
        );

        addVideoButton(
            "Mountain Teaching - 5",

function addVideoButton(
    title,
    reference,
    videoId
) {

    const videoList =
        document.getElementById("videoList");


    const button =
        document.createElement("button");


    button.className =
        "video-button";

    button.dataset.videoId =
    videoId;

    button.innerHTML = `

        <span class="video-icon">
            ▶️
        </span>

        <span class="video-content">

            ${title}

            <br>

            ${reference}

        </span>

    `;


    button.onclick = function() {

        openBibleVideo(videoId);

    };


    videoList.appendChild(button);

}

let youtubePlayer;
let currentVideoIndex = -1;


/* =========================================================
   YOUTUBE PLAYER API
========================================================= */

function onYouTubeIframeAPIReady() {

    youtubePlayer = new YT.Player("youtubePlayer", {

        events: {

            onStateChange: onPlayerStateChange

        }

    });

}


/* =========================================================
   VIDEO FINISHED
========================================================= */

function onPlayerStateChange(event) {

    if (
        event.data ===
        YT.PlayerState.ENDED
    ) {

        playNextVideo();

    }

}


/* =========================================================
   OPEN VIDEO
========================================================= */

function openBibleVideo(videoId) {

    const container =
        document.getElementById(
            "videoPlayerContainer"
        );


    /* Find which video was clicked */

    const buttons =
        document.querySelectorAll(
            "#videoList .video-button"
        );


    buttons.forEach(function(button, index) {

        if (
            button.dataset.videoId ===
            videoId
        ) {

            currentVideoIndex = index;

        }

    });


    container.style.display =
        "block";


if (youtubePlayer && youtubePlayer.loadVideoById) {

    youtubePlayer.loadVideoById(videoId);

}

    container.scrollIntoView({

        behavior: "smooth",

        block: "start"

    });

}


/* =========================================================
   PLAY NEXT VIDEO
========================================================= */

function playNextVideo() {

    const buttons =
        document.querySelectorAll(
            "#videoList .video-button"
        );


    const nextIndex =
        currentVideoIndex + 1;


    if (
        nextIndex >= buttons.length
    ) {

        return;

    }


    currentVideoIndex =
        nextIndex;


    const nextVideoId =
        buttons[nextIndex]
            .dataset.videoId;


    youtubePlayer.loadVideoById(
        nextVideoId
    );

}

   OPEN YOUTUBE VIDEO
========================================================= */




/* =========================================================
   CLOSE VIDEO
========================================================= */

function closeBibleVideo() {

    const container =
        document.getElementById(
            "videoPlayerContainer"
        );

    if (youtubePlayer) {
        youtubePlayer.stopVideo();
    }

    container.style.display = "none";

}

function backToChapters() {

    const savedBook =
        sessionStorage.getItem("book");


    /* Hide current page */

    document.getElementById(
        "videoPage"
    ).style.display = "none";

    document.getElementById(
        "bookPage"
    ).style.display = "none";

    document.getElementById(
        "chapterPage"
    ).style.display = "block";

    document.getElementById(
        "homePage"
    ).style.display = "none";


    /* Rebuild the chapter list */

    if (savedBook) {

        const allBooks = [
            ...bible.old,
            ...bible.new
        ];

        const book =
            allBooks.find(function (item) {

                return item[0] === savedBook;

            });


        if (book) {

            showChapters(
                book[0],
                book[1]
            );

        }

    }

}

    sessionStorage.clear();


    document.getElementById(
        "bookPage"
    ).style.display =
        "none";


    document.getElementById(
        "chapterPage"
    ).style.display =
        "none";


    document.getElementById(
        "videoPage"
    ).style.display =
        "none";


    document.getElementById(
        "homePage"
    ).style.display =
        "block";

}
/* =========================================================
   RESTORE PAGE AFTER REFRESH
========================================================= */

window.addEventListener("DOMContentLoaded", function () {

    const savedPage =
        sessionStorage.getItem("page");

    const savedTestament =
        sessionStorage.getItem("testament");

    const savedBook =
        sessionStorage.getItem("book");

    const savedChapter =
        sessionStorage.getItem("chapter");


    /* =========================
       HIDE ALL PAGES FIRST
    ========================= */

    document.getElementById("homePage").style.display = "none";

    document.getElementById("bookPage").style.display = "none";

    document.getElementById("chapterPage").style.display = "none";

    document.getElementById("videoPage").style.display = "none";


    /* =========================
       NO SAVED PAGE
       SHOW HOME
    ========================= */

    if (!savedPage) {

        document.getElementById("homePage").style.display = "block";

        return;
    }


    /* =========================
       RESTORE BOOK PAGE
    ========================= */

    if (
        savedPage === "books" &&
        savedTestament
    ) {

        showBooks(savedTestament);

        return;
    }


    /* =========================
       RESTORE CHAPTER PAGE
    ========================= */

    if (
        savedPage === "chapters" &&
        savedBook
    ) {

        const allBooks = [
            ...bible.old,
            ...bible.new
        ];

        const book =
            allBooks.find(function (item) {

                return item[0] === savedBook;

            });


        if (book) {

            showChapters(
                book[0],
                book[1]
            );

        } else {

            document.getElementById("homePage").style.display = "block";

        }

        return;
    }


    /* =========================
       RESTORE VIDEO PAGE
    ========================= */

    if (
        savedPage === "videos" &&
        savedBook &&
        savedChapter
    ) {

        openChapter(
            savedBook,
            Number(savedChapter)
        );

        return;
    }


    /* =========================
       FALLBACK
    ========================= */

    document.getElementById("homePage").style.display = "block";

});
</script>
