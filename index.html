<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Bible - King James Version</title>
<link rel="icon" type="image/png" href="logo.png">
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;

    background:
        radial-gradient(
            circle at top,
            #fffdf5 0%,
            #f5ecd5 50%,
            #e7d3a9 100%
        );

    color: #3b2817;
}

html,
body {
    touch-action: manipulation;
    overscroll-behavior: none;
}

/* =========================
   HEADER
========================= */

.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 105px;
    z-index: 1000;

    background:
        linear-gradient(
            135deg,
            #3b210d,
            #70451e,
            #3b210d
        );

    color: white;

    padding: 10px 20px;

    border-bottom: 4px solid #d4af37;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.25);

    display: flex;
    align-items: center;
}

/* LOGO — TOP LEFT */
.header-logo {
    width: clamp(48px, 9vw, 90px);
    height: clamp(48px, 9vw, 90px);

    object-fit: contain;
}


/* TITLE */
.header-title {
    flex: 1;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;
    min-width: 0;
}

.header h1 {
    font-size: clamp(20px, 5vw, 48px);
    letter-spacing: clamp(0.5px, 0.4vw, 2px);

    white-space: nowrap;
    text-align: center;
    margin: 0;
}


/* SUBTITLE */
.header-subtitle {
    color: #f4d982;

    font-size: clamp(9px, 2.2vw, 16px);

    letter-spacing: clamp(0.5px, 0.6vw, 3px);

    white-space: nowrap;
    text-align: center;
    margin-top: 6px;
}

/* =========================
   TOP RIGHT HEADER CONTROLS
========================= */

.header-controls {
    margin-left: auto;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 5px;
}


/* AUDIO VERSION */

.audio-version {
    color: #f4d982;

    font-size: clamp(7px, 1.8vw, 14px);

    font-weight: bold;

    letter-spacing: clamp(0px, 0.2vw, 1px);

    white-space: nowrap;
}


/* HOME BUTTON */

.home-header-button {
    border: 1px solid #d4af37;

    border-radius: 20px;

    padding: clamp(3px, 1vw, 6px)
             clamp(7px, 1.5vw, 16px);

    background:
        linear-gradient(
            135deg,
            #f4d982,
            #c99b2e
        );

    color: #3b210d;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: clamp(9px, 1.8vw, 14px);

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 3px 8px rgba(0,0,0,0.25);

    transition: 0.2s;
}


.home-header-button:hover {

    transform: translateY(-2px);

    background:
        linear-gradient(
            135deg,
            #ffe99a,
            #d4af37
        );

    box-shadow:
        0 5px 12px rgba(0,0,0,0.35);
}


.home-header-button:active {
    transform: scale(0.95);
}

.home-header-button:focus,
.home-header-button:focus-visible {
    outline: none !important;
    box-shadow: 0 3px 8px rgba(0,0,0,0.25) !important;
}

.home-header-button {
    -webkit-tap-highlight-color: transparent;
    -webkit-appearance: none;
    appearance: none;
}
/* =========================
   MAIN
========================= */

.main {
    padding: 125px 20px 40px;
    max-width: 1100px;
    margin: auto;
}


/* =========================
   PAGE
========================= */

.page {
    display: none;
}

.page-title {
    text-align: left;
    font-size: 24px;

    margin: 0;
    padding: 0;

    background: none;
    border: none;

    flex: 1;
}


.page-subtitle {
    text-align: center;
    margin: 0 0 25px;
    padding: 0 10px 12px;

    color: #76582e;

    background: #f5ecd5;

    border-bottom: 2px solid #c7a85b;
}
/* CHAPTER PAGE HEADING */
#chapterPage .sticky-page-header {
    width: 100%;
    margin: 0 0 25px;

    padding: 8px 12px;

    background: linear-gradient(
        180deg,
        #fffdf5,
        #f5ecd5
    );

    border: none;
    box-sizing: border-box;

    text-align: center;
}

#chapterPage .page-title {
    text-align: center;

    font-size: 24px;

    margin: 0;
    padding: 4px 0 2px;

    background: none;
    border: none;
}

#chapterPage .page-subtitle {
    text-align: center;

    font-size: 14px;

    margin: 0;
    padding: 2px 0 5px;

    color: #76582e;

    background: none;
    border: none;
}
/* =========================
   VIDEO PAGE
========================= */

#videoPage .page-title {
    text-align: left;
    font-size: 24px;
    padding: 6px 10px 2px;
    margin: 0;
}

#videoPage .page-subtitle {
    font-size: 0;
    margin: 0;
    padding: 0;
}

/* =========================
   TESTAMENT BUTTONS
========================= */

.testaments {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 30px;

    max-width: 900px;

    margin: 60px auto;
}

.testament-button {
    min-height: 250px;

    border: none;
    border-radius: 22px;

    cursor: pointer;

    color: white;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.20);

    transition: 0.25s;
}

.testament-button:hover {
    transform: translateY(-8px);

    box-shadow:
        0 18px 35px rgba(0,0,0,0.30);
}

.testament-button:active {
    transform: scale(0.97);
}

.old-testament {
    background:
        linear-gradient(
            135deg,
            #674016,
            #a66d2c,
            #75491d
        );
}

.new-testament {
    background:
        linear-gradient(
            135deg,
            #1d4851,
            #327582,
            #235964
        );
}

.book-icon {
    font-size: 58px;
    margin-bottom: 15px;
}

.testament-button h2 {
    font-size: 30px;
    transform: translateY(-2px);
}

.book-count {
    margin-top: 10px;
    font-size: 16px;
}


/* =========================
   BOOK GRID
========================= */

.book-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.book-button {
    background: rgba(255,255,255,0.78);

    border: 2px solid #c7a85b;

    border-radius: 12px;

    padding: 18px 12px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 18px;

    color: #4a321c;

    cursor: pointer;

    box-shadow:
        0 4px 10px rgba(0,0,0,0.08);

    transition: 0.2s;
}

.book-button:hover {
    background: #fff8df;

    transform: translateY(-3px);

    box-shadow:
        0 8px 15px rgba(0,0,0,0.15);
}

.book-number {
    display: block;

    font-size: 13px;

    color: #98752d;

    margin-bottom: 5px;
}

.book-chapters {
    display: block;

    margin-top: 6px;

    font-size: 12px;

    color: #98752d;
}


/* =========================
   CHAPTER GRID
========================= */

.chapter-grid {
    display: grid;

    grid-template-columns:
        repeat(6, 1fr);

    gap: 12px;

    max-width: 900px;

    margin: auto;
}

.chapter-button {
    height: 58px;

    border: 2px solid #c7a85b;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #fffdf5,
            #f5e8c5
        );

    color: #4b3018;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 4px 9px rgba(0,0,0,0.08);

    transition: 0.2s;
}

.chapter-button:hover {
    background: #d4af37;

    color: white;

    transform: translateY(-3px);
}


/* =========================
   VIDEO BUTTON
========================= */

.video-list {
    width: 100%;
    max-width: 700px;

    margin: 25px auto;

    display: flex;
    flex-direction: column;
    gap: 8px;
}

.video-button {
    width: 100%;

    display: flex;
    align-items: center;

    text-align: left;

    padding: 20px;

    border: 2px solid #c7a85b;
    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #fffdf5,
            #f3e3bd
        );

    color: #4b3018;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 20px;

    cursor: pointer;

    box-shadow:
        0 5px 12px rgba(0,0,0,0.12);

    transition: 0.2s;
}

.video-button:hover {
    transform: translateY(-3px);

    background: #fff7dc;

    box-shadow:
        0 8px 18px rgba(0,0,0,0.16);
}

.video-icon {
    flex-shrink: 0;

    margin-right: 15px;

    font-size: 28px;
}

.video-content {
    text-align: left;
}


/* =========================
   YOUTUBE PLAYER
========================= */

/* =========================
   PERSISTENT VIDEO PLAYER
========================= */

.video-player-container {

    display: none;

    position: sticky;

    top: 105px;

    z-index: 950;

    width: 100%;

    max-width: 650px;

    margin: 10px auto 20px;

    background: #181818;

    padding: 10px;

    border-radius: 14px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.30);
}


.video-player {

    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;
}


.video-player iframe {

    width: 100%;

    height: 100%;

    border: none;

    border-radius: 8px;
}


.close-video {

    display: block;

    margin: 12px auto 3px;

    padding: 8px 20px;

    border: none;

    border-radius: 20px;

    background: #555;

    color: white;

    cursor: pointer;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 15px;
}


.close-video:hover {

    background: #777;

}

.video-player {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;
}

.video-player iframe {
    width: 100%;
    height: 100%;

    border: none;

    border-radius: 8px;
}

.close-video {
    display: block;

    margin: 12px auto 3px;

    padding: 8px 20px;

    border: none;

    border-radius: 20px;

    background: #555;

    color: white;

    cursor: pointer;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 15px;
}

.close-video:hover {
    background: #777;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {
    display: block;

    margin: 35px auto 10px;

    border: none;

    border-radius: 30px;

    background: #4b3018;

    color: white;

    padding: 13px 30px;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 17px;

    cursor: pointer;
}

.back-button:hover {
    background: #70451e;
}

/* =========================
   VIDEO SEARCH
========================= */

.search-open-button {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 25px auto 0;
    padding: 15px 20px;

    border: 2px solid #c7a85b;
    border-radius: 30px;

    background: linear-gradient(
        135deg,
        #fffdf5,
        #f3e3bd
    );

    color: #4b3018;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

.search-open-button:hover {
    background: #d4af37;
    color: white;
}


.search-box-container {
    width: 100%;
    max-width: 700px;
    margin: 25px auto 15px;
}

#videoSearchInput {
    width: 100%;
    padding: 15px 20px;

    border: 2px solid #c7a85b;
    border-radius: 30px;

    background: #fffdf5;
    color: #4b3018;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;

    outline: none;
}

#videoSearchInput:focus {
    border-color: #70451e;
}


#searchResults {
    width: 100%;
    max-width: 700px;

    margin: 15px auto;

    display: flex;
    flex-direction: column;
    gap: 8px;
}


.close-search-button {
    display: block;

    margin: 30px auto;

    padding: 12px 28px;

    border: none;
    border-radius: 30px;

    background: #4b3018;
    color: white;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;

    cursor: pointer;
}

.close-search-button:hover {
    background: #70451e;
}

/* =========================
   BIBLE READER WRAPPER
========================= */

.bible-reader-wrapper {
    display: none;
    width: 100%;
    max-width: 850px;
    margin: 20px auto 25px;
    position: relative;
    box-sizing: border-box;
}


/* =========================
   TOP CONTROLS
   OUTSIDE READING BOX
========================= */

.bible-reader-top-controls {
    width: 100%;
    min-height: 38px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 6px;

    margin-bottom: 6px;

    box-sizing: border-box;
}


/* =========================
   FONT CONTROLS
========================= */

.bible-reader-controls {
    display: flex;
    gap: 5px;
}

.bible-reader-controls button {
    min-width: 34px;
    height: 32px;

    padding: 4px 8px;

    border: 1px solid #b8943d;
    border-radius: 6px;

    background: linear-gradient(
        to bottom,
        #fffdf5,
        #ead9ad
    );

    color: #5b3a00;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
}

.bible-reader-controls button:hover {
    background: #f5e6bd;
}


/* =========================
   CLOSE BUTTON
========================= */

.close-bible {
    width: 32px;
    height: 32px;

    padding: 0;

    border: 1px solid #b8943d;
    border-radius: 6px;

    background: linear-gradient(
        to bottom,
        #fffdf5,
        #ead9ad
    );

    color: #6b0000;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 2px 5px rgba(0,0,0,0.12);
}

.close-bible:hover {
    background: #f0d9a0;
}


/* =========================
   BIBLE READING BOX
========================= */

.bible-reader-container {
    display: none;

    position: relative;

    width: 100%;

    background: linear-gradient(
        135deg,
        #fffdf5,
        #f7efd8
    );

    border: 2px solid #c9a227;

    border-radius: 14px;

    box-shadow:
        0 6px 18px rgba(0,0,0,0.15);

    padding: 20px;

    box-sizing: border-box;

    overflow: hidden;
}


/* =========================
   CHAPTER TITLE
   INSIDE THE BOX
========================= */

.bible-reader-title {
    width: 100%;

    margin: 0 0 18px;

    padding: 5px 10px 12px;

    border-bottom: 2px solid #c7a85b;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 24px;

    font-weight: bold;

    line-height: 1.3;

    text-align: center;

    color: #5b3a00;

    box-sizing: border-box;
}


/* =========================
   BIBLE TEXT
========================= */

.bible-text {
    width: 100%;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 18px;

    line-height: 1.8;

    color: #292000;

    box-sizing: border-box;
}


/* =========================
   VERSES
========================= */

.bible-verse {
    margin-bottom: 12px;
}

.verse-number {
    font-weight: bold;

    color: #8a6500;

    margin-right: 7px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .bible-reader-wrapper {
        margin: 15px auto 20px;
    }

    .bible-reader-container {
        padding: 15px;
        border-radius: 12px;
    }

    .bible-reader-title {
        font-size: 21px;
        margin-bottom: 15px;
        padding-bottom: 10px;
    }

    .bible-reader-top-controls {
        min-height: 34px;
        margin-bottom: 5px;
    }

    .bible-reader-controls {
        gap: 4px;
    }

    .bible-reader-controls button {
        min-width: 34px;
        height: 32px;
        padding: 3px 6px;
        font-size: 14px;
    }

    .close-bible {
        width: 32px;
        height: 32px;
        font-size: 15px;
    }

    .bible-text {
        font-size: 18px;
        line-height: 1.75;
    }
}


@media (max-width: 450px) {

    .bible-reader-wrapper {
        margin-top: 10px;
    }

    .bible-reader-container {
        padding: 12px;
    }

    .bible-reader-title {
        font-size: 19px;
        padding-left: 5px;
        padding-right: 5px;
    }

    .bible-reader-top-controls {
        gap: 4px;
    }

    .bible-reader-controls button {
        min-width: 31px;
        height: 30px;
        padding: 2px 5px;
        font-size: 13px;
    }

    .close-bible {
        width: 30px;
        height: 30px;
        font-size: 14px;
    }

    .bible-text {
        font-size: 18px;
        line-height: 1.7;
    }
}

/* ==============================
   CHAPTER HEADING + READ BIBLE
============================== */

.chapter-heading-row {
    position: relative;

    width: 100%;
    min-height: 52px;

    display: flex;
    align-items: center;

    box-sizing: border-box;

    margin: 0 0 4px;
    padding: 6px 10px;

    background: linear-gradient(
        180deg,
        #fffdf5,
        #f5ecd5
    );

    border-bottom: none;
}

/* TESTAMENT / BOOK PAGE HEADING */
#bookPage .sticky-page-header {
    width: 100%;
    margin: 0 0 25px;

    padding: 8px 12px;

    background: linear-gradient(
        180deg,
        #fffdf5,
        #f5ecd5
    );

    border: none;
    box-sizing: border-box;

    text-align: center;
}

#bookPage .page-title {
    text-align: center;

    font-size: 24px;

    margin: 0;
    padding: 4px 0 2px;

    background: none;
    border: none;
}

#bookPage .page-subtitle {
    text-align: center;

    font-size: 14px;

    margin: 0;
    padding: 2px 0 5px;

    color: #76582e;

    background: none;
    border: none;
}
/* =========================
   SEARCH PAGE HEADING
========================= */

#searchPage .sticky-page-header {
    width: 100%;
    margin: 0 0 25px;

    padding: 8px 12px;

    background: linear-gradient(
        180deg,
        #fffdf5,
        #f5ecd5
    );

    border: none;
    box-sizing: border-box;

    text-align: center;
}

#searchPage .page-title {
    text-align: center;

    font-size: 24px;

    margin: 0;
    padding: 4px 0 2px;

    background: none;
    border: none;
}

#searchPage .page-subtitle {
    text-align: center;

    font-size: 14px;

    margin: 0;
    padding: 2px 0 5px;

    color: #76582e;

    background: none;
    border: none;
}
/* READ BIBLE BUTTON */

.read-bible-button {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    padding: 8px 15px;

    border: 2px solid #c7a85b;
    border-radius: 22px;

    background: linear-gradient(
        135deg,
        #fffdf5,
        #f3e3bd
    );

    color: #4b3018;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 4px 10px rgba(0,0,0,0.10);
}


.read-bible-button:hover {

    background: #d4af37;

    color: white;

    transform:
        translateY(calc(-50% - 2px));
}



/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header {
        height: 95px;
    }

    .main {
        padding-top: 115px;
    }

    .audio-version {
        font-size: 10px;
        letter-spacing: 0.5px;
    }

.home-header-button {
    padding: 6px 14px;
    font-size: 14px;
}

    .testaments {
        grid-template-columns: 1fr;
        margin: 30px 30px;
    }

    .testament-button {
        min-height: 200px;
    }

    .book-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .chapter-grid {
        grid-template-columns: repeat(5, 1fr);
    }

    .book-button {
        font-size: 16px;
    }

#videoPage .page-title {
    font-size: 20px;
}
}

@media (max-width: 450px) {

    .header {
        height: 90px;
    }

    .main {
        padding-top: 110px;
    }


    .audio-version {
        font-size: 9px;
        letter-spacing: 0.3px;
    }

.home-header-button {
    padding: 5px 12px;
    font-size: 13px;
}

    .chapter-grid {
        grid-template-columns: repeat(4, 1fr);
    }

    .chapter-button {
        height: 52px;
        font-size: 18px;
    }

    .video-button {
        font-size: 17px;
    }

#videoPage .page-title {
    font-size: 18px;
}
}

@media (max-width: 330px) {

    .chapter-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <img
        src="logo.png"
        alt="Holy Bible Logo"

    >

                ${book[1]}

            </span> 
 
        `;

            showChapters(

    });

        "block"; 
 
 
    document.getElementById("chapterPageTitle")

        bookName; 
 
 
    document.getElementById("chapterPageSubtitle") 
        .textContent = 
        chapterCount + 
        (chapterCount === 1 
            ? " Chapter" 
            : " Chapters"); 
 
 
    const grid = 
        document.getElementById("chapterGrid"); 
 
 
    grid.innerHTML = ""; 
 
 
    for ( 
        let chapter = 1; 
        chapter <= chapterCount; 
        chapter++ 
    ) { 
 
        const button = 
            document.createElement("button"); 
 
 
        button.className = 
            "chapter-button"; 
 
 
        button.textContent = 
            chapter; 
 
 
        button.onclick = function() { 
 
            openChapter( 
                bookName, 
                chapter 
            ); 
 
        }; 
 
 
        grid.appendChild(button); 
 
    } 
 
}

            allBibleVideos.push({ 
 
                title: title, 
                reference: reference, 
                videoId: videoId 
 
            }); 
 
        } 
 
        return; 
    } 
 
 
    /* ========================= 
       NORMAL CHAPTER BUTTON 
    ========================= */ 
 
    const videoList = 
        document.getElementById("videoList"); 
 
 
    const button = 
        document.createElement("button"); 
 
 
    button.className = 
        "video-button"; 
 
 
    button.dataset.videoId = 
        videoId; 
 
 
    button.innerHTML = ` 
 
        <span class="video-icon"> 
            ▶️ 
        </span> 
 
        <span class="video-content"> 
 
            ${title} 
 
            <br> 
 
            ${reference} 
 
        </span> 
 
    `; 
 
 
    button.onclick = function() { 
 
        openBibleVideo(videoId); 
 
    }; 
 
 
    videoList.appendChild(button); 
 
} 
 
/* ========================================================= 
   BUILD GLOBAL VIDEO SEARCH 
========================================================= */ 
 
function buildVideoSearchIndex() { 
 
    allBibleVideos = []; 
 
    buildingSearchIndex = true; 
 
 
    const allBooks = [ 
        ...bible.old, 
        ...bible.new 
    ]; 
 
 
    allBooks.forEach(function(book) { 
 
        const bookName = book[0]; 
        const chapterCount = book[1]; 
 
 
        for ( 
            let chapter = 1; 
            chapter <= chapterCount; 
            chapter++ 
        ) { 
 
            loadChapterVideos( 
                bookName, 
                chapter 
            ); 
 
        } 
 
    }); 
 
 
    buildingSearchIndex = false; 
 
 
    /* Clear temporary chapter list */ 
 
    document.getElementById("videoList").innerHTML = ""; 
 
}

/* ========================================================= 
   SEARCH VIDEOS 
========================================================= */ 
 
function searchBibleVideos() { 
 
    const searchText = 
        document.getElementById("videoSearchInput") 
            .value 
            .toLowerCase() 
            .trim(); 
 
 
    const results = 
        document.getElementById("searchResults"); 
 
 
    results.innerHTML = ""; 
 
 
    if (searchText === "") { 
 
        return; 
 
    } 
 
 
    const matchedVideos = 
        allBibleVideos.filter(function(video) { 
 
            return ( 
                video.title 
                    .toLowerCase() 
                    .includes(searchText) 
 
                || 
 
                video.reference 
                    .toLowerCase() 
                    .includes(searchText) 
            ); 
 
        }); 
 
 
    matchedVideos.forEach(function(video) { 
 
        const button = 
            document.createElement("button"); 
 
 
        button.className = 
            "video-button"; 
 
 
        button.dataset.videoId = 
            video.videoId; 
 
 
        button.innerHTML = ` 
 
            <span class="video-icon"> 
                ▶️ 
            </span> 
 
            <span class="video-content"> 
 
                ${video.title} 
 
                <br> 
 
                ${video.reference} 
 
            </span> 
 
        `; 
 
 
        button.onclick = function() { 
 
            openSearchVideo( 
                video.videoId 
            ); 
 
        }; 
 
 
        results.appendChild(button); 
 
    }); 
 
 
    if (matchedVideos.length === 0) { 
 
        results.innerHTML = ` 
 
            <p style=" 
                text-align:center; 
                padding:20px; 
                color:#76582e; 
            "> 
 
                No videos found 
 
            </p> 
 
        `; 
 
    } 
 
}

/* =========================================================

        YT.PlayerState.ENDED 
    ) { 
 
        playNextVideo(); 
 
    } 
 
} 
 
 
/* ========================================================= 
   OPEN VIDEO 
========================================================= */ 
 
function openBibleVideo(videoId) { 
 
    const container = 
        document.getElementById( 
            "videoPlayerContainer" 
        ); 
 
 
    /* Find which video was clicked */ 
 
    const buttons = 
        document.querySelectorAll( 
            "#videoList .video-button" 
        ); 
 
 
    buttons.forEach(function(button, index) { 
 
        if ( 
            button.dataset.videoId === 
            videoId 
        ) { 
 
            currentVideoIndex = index; 
 
        } 
 
    }); 
 
 
    container.style.display = 
        "block"; 
 
 
if (youtubePlayer && youtubePlayer.loadVideoById) { 
 
    youtubePlayer.loadVideoById(videoId); 
 
} 
 
    container.scrollIntoView({ 
 
        behavior: "smooth", 
 
        block: "start" 
 
    }); 
 
} 
 
 
/* ========================================================= 
   PLAY NEXT VIDEO 
========================================================= */ 
 
function playNextVideo() { 
 
    const buttons = 
        document.querySelectorAll( 
            "#videoList .video-button" 
        ); 
 
 
    const nextIndex = 
        currentVideoIndex + 1; 
 
 
    if ( 
        nextIndex >= buttons.length 
    ) { 
 
        return; 
 
    } 
 
 
    currentVideoIndex = 
        nextIndex; 
 
 
    const nextVideoId = 
        buttons[nextIndex] 
            .dataset.videoId; 
 
 
    youtubePlayer.loadVideoById( 
        nextVideoId 
    ); 
 
}

/* ============================== 
   BIBLE READER 
   ============================== */ 
 
let currentBibleData = null; 
let bibleReaderOpen = false; 

/* =========================================================
   BIBLE READER TEXT ZOOM
========================================================= */

let bibleFontSize = 18;

function changeBibleFontSize(amount) {

    bibleFontSize += amount;

    /* Minimum size */
    if (bibleFontSize < 14) {
        bibleFontSize = 14;
    }

    /* Maximum size */
    if (bibleFontSize > 32) {
        bibleFontSize = 32;
    }

    const bibleText =
        document.getElementById("bibleText");

    if (bibleText) {

        bibleText.style.fontSize =
            bibleFontSize + "px";
    }
}


function resetBibleFontSize() {

    bibleFontSize = 18;

    const bibleText =
        document.getElementById("bibleText");

    if (bibleText) {

        bibleText.style.fontSize =
            bibleFontSize + "px";
    }

} 

async function loadBibleBook(book) { 
 
    try { 
 
        const response = await fetch( 
            "bible/" + encodeURIComponent(book) + ".json" 
        ); 
 
        if (!response.ok) { 
            throw new Error("Bible file not found"); 
        } 
 
        currentBibleData = await response.json(); 
 
        return currentBibleData; 
 
    } catch (error) { 
 
        console.error("Unable to load Bible:", error); 
 
        currentBibleData = null; 
 
        return null; 
    } 
} 
 
async function toggleBibleReader() {

    const wrapper =
        document.querySelector(".bible-reader-wrapper");

    const container =
        document.getElementById("bibleReaderContainer");

    if (bibleReaderOpen) {

        closeBibleReader();

        return;
    }


    const book =
        sessionStorage.getItem("book");

    const chapter =
        sessionStorage.getItem("chapter");


    if (!book || !chapter) {

        return;
    }


    bibleReaderOpen = true;


    /* Show entire reader */
    wrapper.style.display = "block";


    /* Show reading box */
    container.style.display = "block";


    /* Chapter title */
    document.getElementById("bibleReaderTitle").textContent =
        book + " - Ch " + chapter;


    /* Loading message */
    document.getElementById("bibleText").innerHTML =
        "<p>Loading Bible text...</p>";


    /* Change READ BIBLE button */
    const button =
        document.getElementById("readBibleButton");

    if (button) {

        button.textContent =
            "CLOSE BIBLE";
    }


    /* Load chapter */
    await updateBibleReader(book, chapter);


    /* Scroll to reader */
    wrapper.scrollIntoView({

        behavior: "smooth",

        block: "start"

    });
} 
 
 
async function updateBibleReader(book, chapter) { 
 
    const data = 
        await loadBibleBook(book); 
 
 
    const textContainer = 
        document.getElementById("bibleText"); 
 
 
    if (!data) { 
 
        textContainer.innerHTML = 
            "<p>Unable to load Bible text.</p>"; 
 
        return; 
    } 
 
 
    const verses = 
        data.chapters[String(chapter)]; 
 
 
    if (!verses) { 
 
        textContainer.innerHTML = 
            "<p>Bible text for this chapter is not available yet.</p>"; 
 
        return; 
    } 
 
 
    document.getElementById("bibleReaderTitle").textContent = 
        book + " - Ch " + chapter; 
 
 
    textContainer.innerHTML = ""; 
 
 
    Object.entries(verses).forEach( 
        ([verseNumber, verseText]) => { 
 
            const verse = 
                document.createElement("div"); 
 
            verse.className = "bible-verse"; 
 
 
            verse.innerHTML = 
                `<span class="verse-number">${verseNumber}</span> 
                 ${verseText}`; 
 
 
            textContainer.appendChild(verse); 
 
        } 
    ); 
} 
 
 
function closeBibleReader() {

    const wrapper =
        document.querySelector(".bible-reader-wrapper");

    const container =
        document.getElementById("bibleReaderContainer");


    /* Hide entire reader */
    wrapper.style.display = "none";

    container.style.display = "none";


    /* Clear title */
    document.getElementById("bibleReaderTitle").textContent = "";


    /* Clear Bible text */
    document.getElementById("bibleText").innerHTML = "";


    /* Restore READ BIBLE button */
    const button =
        document.getElementById("readBibleButton");

    if (button) {

        button.textContent =
            "READ BIBLE";
    }


    bibleReaderOpen = false;

    currentBibleData = null;
}
 
/* ========================================================= 
   RESTORE PAGE AFTER REFRESH 
========================================================= */ 
 
window.addEventListener("DOMContentLoaded", function () { 
 
    const savedPage = 
        sessionStorage.getItem("page"); 
 
    const savedTestament = 
        sessionStorage.getItem("testament"); 
 
    const savedBook = 
        sessionStorage.getItem("book"); 
 
    const savedChapter = 
        sessionStorage.getItem("chapter"); 
 
 
    /* ========================= 
       HIDE ALL PAGES FIRST 
    ========================= */ 
 
    document.getElementById("homePage").style.display = "none"; 
 
    document.getElementById("bookPage").style.display = "none"; 
 
    document.getElementById("chapterPage").style.display = "none"; 
 
    document.getElementById("videoPage").style.display = "none"; 
 
 
    /* ========================= 
       NO SAVED PAGE 
       SHOW HOME 
    ========================= */ 
 
    if (!savedPage) { 
 
        document.getElementById("homePage").style.display = "block"; 
 
        return; 
    } 
 
 
    /* ========================= 
       RESTORE BOOK PAGE 
    ========================= */ 
 
    if ( 
        savedPage === "books" && 
        savedTestament 
    ) { 
 
        showBooks(savedTestament); 
 
        return; 
    } 
 
 
    /* ========================= 
       RESTORE CHAPTER PAGE 
    ========================= */ 
 
    if ( 
        savedPage === "chapters" && 
        savedBook 
    ) { 
 
        const allBooks = [ 
            ...bible.old, 
            ...bible.new 
        ]; 
 
        const book = 
            allBooks.find(function (item) { 
 
                return item[0] === savedBook; 
 
            }); 
 
 
        if (book) { 
 
            showChapters( 
                book[0], 
                book[1] 
            ); 
 
        } else { 
 
            document.getElementById("homePage").style.display = "block"; 
 
        } 
 
        return; 
    } 
 
 
    /* ========================= 
       RESTORE VIDEO PAGE 
    ========================= */ 
 
    if ( 
        savedPage === "videos" && 
        savedBook && 
        savedChapter 
    ) { 
 
        openChapter( 
            savedBook, 
            Number(savedChapter) 
        ); 
 
        return; 
    } 
 
 
    /* ========================= 
       FALLBACK 
    ========================= */ 
 
    document.getElementById("homePage").style.display = "block"; 
 
});

    if (e.key === "F12") {
        e.preventDefault();
        return false;
    }

    // Disable Ctrl + Shift + I
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "i") {
        e.preventDefault();
        return false;
    }

    // Disable Ctrl + Shift + J
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "j") {
        e.preventDefault();
        return false;
    }

    // Disable Ctrl + U (View Source)
    if (e.ctrlKey && e.key.toLowerCase() === "u") {
        e.preventDefault();
        return false;
    }
});

// Disable Ctrl + Plus / Ctrl + Minus / Ctrl + 0
document.addEventListener("keydown", function (e) {

    if (e.ctrlKey) {

        // Ctrl + +
        if (e.key === "+" || e.key === "=") {
            e.preventDefault();
            return false;
        }

        // Ctrl + -
        if (e.key === "-") {
            e.preventDefault();
            return false;
        }

        // Ctrl + 0
        if (e.key === "0") {
            e.preventDefault();
            return false;
        }
    }

}, { passive: false });


// Disable Ctrl + Mouse Wheel zoom
document.addEventListener("wheel", function (e) {

    if (e.ctrlKey) {
        e.preventDefault();
    }

}, { passive: false });
